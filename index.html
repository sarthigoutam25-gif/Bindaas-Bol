<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bindaas Bol</title>
<meta name="theme-color" content="#06207A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-sized app column, centred on wide screens; every screen is a flex column with a scrolling middle and a pinned action area. */
:root{
  --navy:#06207A; --orange:#F47B0F; --orange-d:#C2570A; --ink:#14194A; --mut:#44507A;
  --line:#D5DAEE; --tint:#F5F7FF; --tint2:#E4EAFF; --peach:#FFE9D3; --white:#FFFFFF; --bad:#C62828; --good:#1B7F4B;
  --display:'Baloo 2','Trebuchet MS',sans-serif; --body:'Poppins',system-ui,sans-serif;
  color-scheme: light;
}
html,body{height:100%}
body{margin:0;background:#DDE3F7;color:var(--ink);font-family:var(--body);font-size:14px}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
#shell{height:100%;display:flex;justify-content:center;align-items:center}
#app{position:relative;width:100%;max-width:430px;height:100%;max-height:900px;background:var(--white);overflow:hidden;display:flex;flex-direction:column}
@media (min-width:520px){#app{border-radius:32px;box-shadow:0 24px 60px rgba(6,32,122,.28)}}
.screen{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;animation:in .22s ease-out}
@keyframes in{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:0 22px 16px}
.pad{padding:0 22px}
.dock{padding:12px 22px 22px;display:flex;flex-direction:column;align-items:center;gap:2px}
h1,h2,h3{margin:0;font-family:var(--display);color:var(--ink)}
h1{font-weight:800;font-size:26px;line-height:1.15;color:var(--navy)}
h2{font-weight:700;font-size:18px}
h3{font-weight:700;font-size:16px}
p{margin:0}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;border-radius:28px;background:var(--navy);color:#fff;font-family:var(--display);font-weight:700;font-size:20px;box-shadow:0 10px 22px rgba(6,32,122,.28);text-decoration:none}
.btn:disabled{background:#9AA5CF;box-shadow:none;cursor:not-allowed}
.btn.ghost{height:50px;background:#fff;color:var(--navy);border:2px solid var(--orange);box-shadow:none;font-size:18px}
.btn.orange{background:var(--orange);color:var(--ink);box-shadow:0 10px 22px rgba(244,123,15,.3)}
.link{min-height:44px;display:inline-flex;align-items:center;font-weight:600;font-size:14px;color:var(--navy)}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;padding:16px 20px 8px}
.back{width:44px;height:44px;border-radius:22px;background:var(--tint);display:grid;place-items:center;flex:none}
.hero{position:absolute;left:0;top:0;right:0;background:var(--navy);border-radius:0 0 44px 44px;z-index:0}
.blob{position:absolute;border-radius:50%;pointer-events:none}
.z{position:relative;z-index:1}
.field{display:flex;flex-direction:column;gap:4px}
.field label,.lbl{font-size:12px;font-weight:500;color:var(--mut)}
.inp{height:50px;border:2px solid var(--line);border-radius:14px;background:var(--tint);padding:0 16px;font:500 15px var(--body);color:var(--ink);width:100%}
.inp:focus{border-color:var(--navy);outline:none;background:#fff}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 20px) 22px,calc(100% - 15px) 22px;background-size:5px 5px;background-repeat:no-repeat}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:40px;padding:0 16px;border-radius:20px;border:2px solid var(--line);background:#fff;color:var(--ink);font-size:13px;font-weight:500}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.or.on{background:var(--orange);border-color:var(--orange);color:var(--ink);font-weight:600}
.card{background:#fff;border-radius:22px;box-shadow:0 4px 18px rgba(6,32,122,.1)}
.tile{display:flex;flex-direction:column;justify-content:space-between;height:112px;padding:14px;text-align:left;font-weight:600;font-size:14px}
.ico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none}
.i-b{background:var(--tint2)} .i-o{background:var(--peach)}
.bar{height:10px;border-radius:5px;background:var(--tint2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:5px;background:var(--navy)}
.bar.o>i{background:var(--orange)}
.nav{height:74px;border-top:1px solid #E4E8F6;background:#fff;display:flex;padding:0 8px;flex:none}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:500;color:var(--mut)}
.nav button.on{color:var(--navy);font-weight:600}
.row{display:flex;align-items:center;gap:12px}
.tick{width:22px;height:22px;border-radius:11px;background:var(--navy);display:grid;place-items:center;flex:none}
.tick.no{background:#fff;border:2px solid var(--orange-d)}
.opt{display:flex;align-items:center;gap:14px;min-height:58px;padding:0 18px;border:2px solid var(--line);border-radius:16px;background:#fff;font-size:17px;font-weight:500;text-align:left;width:100%}
.opt.sel{border-color:var(--navy);background:var(--tint2)}
.opt.ok{border-color:var(--good);background:#E6F6EC}
.opt.no{border-color:var(--bad);background:#FDECEC}
.radio{width:22px;height:22px;border-radius:11px;border:2px solid var(--line);flex:none}
.opt.sel .radio{border:7px solid var(--navy)}
.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:24px;font-size:14px;font-weight:500;z-index:30;max-width:86%;text-align:center}
.sheet-bg{position:absolute;inset:0;background:rgba(10,18,64,.55);z-index:20;display:flex;align-items:flex-end}
.sheet{width:100%;background:#fff;border-radius:28px 28px 0 0;padding:22px 22px 26px;display:flex;flex-direction:column;gap:12px}
.cbtn{width:56px;height:56px;border-radius:28px;background:#fff;display:grid;place-items:center}
.cbtn.off{background:#FF6B5E}
.mono{font-variant-numeric:tabular-nums}
.otp{display:flex;gap:10px;justify-content:center}
.otp input{width:50px;height:60px;text-align:center;border:2px solid var(--line);border-radius:14px;background:var(--tint);font:700 26px var(--display);color:var(--navy)}
.otp input:focus{border-color:var(--navy);background:#fff;outline:none;box-shadow:0 0 0 4px rgba(6,32,122,.12)}
.err{color:var(--bad);font-size:13px;font-weight:500;min-height:18px}
.dot{width:8px;height:8px;border-radius:4px;background:var(--orange);opacity:.5}
.dot.on{width:26px;background:var(--navy);opacity:1}
</style>


</head>
